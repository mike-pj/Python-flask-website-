
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Assignment</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>

<body>
    <h1>Edit Assignment</h1>

    <p>Update the assignment details below.</p>

    <form method="POST">
        <p>
            <label for="title">Assignment Title:</label><br>
            <input type="text"
                   id="title"
                   name="title"
                   value="{{ assignment.title }}"
                   required>
        </p>

        <p>
            <label for="due_date">Due Date:</label><br>
            <input type="date"
                   id="due_date"
                   name="due_date"
                   value="{{ assignment.due_date }}"
                   required>
        </p>

        <p>
            <label for="status">Assignment Status:</label><br>
            <select id="status" name="status" required>
                <option value="Pending"
                    {% if assignment.status == 'Pending' %}selected{% endif %}>
                    Pending
                </option>

                <option value="Submitted"
                    {% if assignment.status == 'Submitted' %}selected{% endif %}>
                    Submitted
                </option>
            </select>
        </p>

        <button type="submit">Save Changes</button>
    </form>

    <p>
        <a href="{{ url_for('assignments') }}">Cancel and Go Back</a>
    </p>
</body>
</html>
